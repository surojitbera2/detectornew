# Host Nginx vhost for aiagent.sciencedomain.info
# Place at: /etc/nginx/sites-available/aiagent.sciencedomain.info
# Then:     sudo ln -s /etc/nginx/sites-available/aiagent.sciencedomain.info /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Start with HTTP only. When you run:
#   sudo certbot --nginx -d aiagent.sciencedomain.info
# Certbot will automatically:
#   - fetch the cert
#   - add a `listen 443 ssl` block with the cert paths
#   - convert this block into an HTTP -> HTTPS redirect

server {
    listen 80;
    listen [::]:80;
    server_name aiagent.sciencedomain.info;

    client_max_body_size 350M;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # Let's Encrypt HTTP-01 challenges (Certbot writes here)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Reverse-proxy everything to the dashboard container
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}

# After `certbot --nginx` completes, it will:
#   1. add a `server { listen 443 ssl http2; ... ssl_certificate ... }` block below
#   2. rewrite the port-80 block above into a redirect to HTTPS
#   3. add these security headers (or you can uncomment them yourself later):
#        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
#        add_header X-Frame-Options "SAMEORIGIN" always;
#        add_header X-Content-Type-Options "nosniff" always;
#        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
