# Host Nginx vhost for aiagent.sciencedomain.info
# Place at: /etc/nginx/sites-available/aiagent.sciencedomain.info
# Then:     sudo ln -s /etc/nginx/sites-available/aiagent.sciencedomain.info /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#
# Certbot will inject the SSL directives when you run:
#   sudo certbot --nginx -d aiagent.sciencedomain.info

# ---------- HTTP: redirect everything to HTTPS ----------
server {
    listen 80;
    listen [::]:80;
    server_name aiagent.sciencedomain.info;

    # Let's Encrypt HTTP-01 challenges (Certbot writes here)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- HTTPS: reverse proxy to the dashboard container ----------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aiagent.sciencedomain.info;

    # Allow large uploads (individual files up to ~300 MB per the core service).
    client_max_body_size 350M;

    # Reasonable timeouts for large-file cleaning jobs.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_connect_timeout 30s;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Everything (frontend static + /api proxied by the container's internal nginx)
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }

    # ssl_certificate & ssl_certificate_key are added automatically by Certbot.
}
